<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Altiveil Extension List - ページが見つかりません</title>
    <script>
      // GitHub Pages SPA fallback
      // 存在しないパスへのアクセスを index.html へリダイレクトし、
      // 元のパスをクエリパラメータで渡してSPAルーターに処理させる
      var pathSegmentsToKeep = 1; // /altiveil-extensions-list/ の1セグメント分
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/' +
        '?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
